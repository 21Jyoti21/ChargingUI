<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TitleBar Demo</title>
    <link rel="stylesheet" href="./title.css">
    <script src="./data.js"></script>
    <script src="./title.js"></script>
</head>
<body>
    <div class="container">
    <div class="lcd">
      <h2 id="line1">TitleBar Demo</h2>
      <hr>
      <div>
         <!-- <button onclick="data.activate(true)"> Active </button>
         <button onclick="slider.activate(false)"> Deactive </button> -->
         <!-- <button onclick="slider.showProgress('Starting...')"> Show Progress </button> 
         <button onclick="slider.hideProgress()"> Hide Progress </button>  -->
      </div>
      <hr>
    </div>

    <div id="title-container"></div>
  </div>
  <script>
    const title=new TitleBar(
        document.getElementById("title-container"),
        {
            titleText: data.titleText,
            backgColor: data.backgColor,
            logo: data.logo
        }
    );
    let isLoggedIn = false;
    updateButtons();

    function updateButtons() {
      const buttons = [
          { icon: "login1.png", id: "login", text: "Login", visible: !isLoggedIn },
          { icon: "logout1.png", id: "logout", text: "Logout", visible: isLoggedIn }
      ];
      title.setButtons(buttons, handleClick);
    }
    function handleClick(id) {
        console.log("Clicked:", id);
        if (id === "login") {
          isLoggedIn = true;
        } else if (id === "logout") {
            isLoggedIn = false;
        }
        updateButtons();
    }
  </script>
</body>
</html>
